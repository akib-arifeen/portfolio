    screen: { blue: 15, pink: 75, yellow: 0 }, plate: { blue: [1.0, -.6], pink: [-1.3, .9], yellow: [.7, 1.4] } },

// ---- LOOKS -----------------------------------------------------------------

//   screen    flat spot colours that overprint, plainly out of register           screen print, gig posters
//   ink       flat colour with hatching along the form and a heavy line           pen and wash, storybook
//   marker    flat colour that overprints, one dark contour, a faint grid ground  explainer and educational video
